<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="pfBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b4d3c"/>
      <stop offset="60%" stop-color="#133c2e"/>
      <stop offset="100%" stop-color="#0c231a"/>
    </linearGradient>
    <linearGradient id="pfLime" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dcfc75"/>
      <stop offset="100%" stop-color="#b4e43b"/>
    </linearGradient>
    <linearGradient id="pfCoral" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff8c78"/>
      <stop offset="100%" stop-color="#f2553b"/>
    </linearGradient>
    <linearGradient id="pfStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(200,239,104,0.42)"/>
      <stop offset="45%" stop-color="rgba(200,239,104,0.12)"/>
      <stop offset="100%" stop-color="rgba(255,118,95,0.32)"/>
    </linearGradient>
    <filter id="pfGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Luxury Squircle Tile -->
  <rect x="4" y="4" width="112" height="112" rx="34" fill="url(#pfBg)" stroke="url(#pfStroke)" stroke-width="1.6"/>
  <!-- Ambient energy glow in top corner -->
  <circle cx="92" cy="28" r="26" fill="#c8ef68" opacity="0.09" filter="url(#pfGlow)"/>

  <!-- Pod 1: Far Left (Vitality Lime Droplet) -->
  <ellipse cx="32" cy="45" rx="7.5" ry="12" transform="rotate(-34 32 45)" fill="url(#pfLime)"/>
  
  <!-- Pod 2: Mid Left (Vitality Lime Droplet) -->
  <ellipse cx="48" cy="31" rx="8.5" ry="13.5" transform="rotate(-12 48 31)" fill="url(#pfLime)"/>
  
  <!-- Pod 3: Mid Right (Pristine Nutrition Droplet) -->
  <ellipse cx="72" cy="31" rx="8.5" ry="13.5" transform="rotate(12 72 31)" fill="#ffffff"/>
  
  <!-- Pod 4: Far Right (Warm Fuel Spark - Signature Brand Accent) -->
  <ellipse cx="88" cy="45" rx="7.5" ry="12" transform="rotate(34 88 45)" fill="url(#pfCoral)"/>

  <!-- Main Vessel Pad: Fluid Nutrition Droplet -->
  <g>
    <path d="M 60 95 C 43 95 31 83 31 69 C 31 59 40 54 50 60 C 55 63 58 65 60 66 C 62 65 65 63 70 60 C 80 54 89 59 89 69 C 89 83 77 95 60 95 Z" fill="#ffffff"/>
    
    <!-- Fuel Lightning Bolt (Precision Negative Energy Space) -->
    <path d="M 62 62 L 50 75 H 61 L 56 87 L 72 73 H 61 Z" fill="url(#pfBg)"/>
    <!-- Core Nutrition Spark inside Bolt -->
    <circle cx="60.5" cy="74" r="2" fill="url(#pfLime)"/>
  </g>
</svg>