<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 120" fill="none">
  <defs>
    <linearGradient id="bmBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b4d3c"/>
      <stop offset="60%" stop-color="#133c2e"/>
      <stop offset="100%" stop-color="#0c231a"/>
    </linearGradient>
    <linearGradient id="bmLime" x1="0%" y1="0%" x2="100%" y2="100%">
