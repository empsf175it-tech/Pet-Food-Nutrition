  <!-- Left Icon Emblem (92x92) -->
  <g transform="translate(14, 14)">
    <rect width="92" height="92" rx="28" fill="url(#bmBg)" stroke="url(#bmStroke)" stroke-width="1.5"/>
    <ellipse cx="26" cy="35" rx="6" ry="9.5" transform="rotate(-34 26 35)" fill="url(#bmLime)"/>
    <ellipse cx="38" cy="24" rx="7" ry="11" transform="rotate(-12 38 24)" fill="url(#bmLime)"/>
    <ellipse cx="58" cy="24" rx="7" ry="11" transform="rotate(12 58 24)" fill="#ffffff"/>
    <ellipse cx="70" cy="35" rx="6" ry="9.5" transform="rotate(34 70 35)" fill="url(#bmCoral)"/>
    <g>
      <path d="M 48 76 C 34 76 25 66 25 55 C 25 47 32 43 40 48 C 44 50 46 52 48 53 C 50 52 52 50 56 48 C 64 43 71 47 71 55 C 71 66 62 76 48 76 Z" fill="#ffffff"/>
      <path d="M 50 49 L 40 60 H 49 L 45 70 L 58 58 H 49 Z" fill="url(#bmBg)"/>
      <circle cx="48.5" cy="59" r="1.6" fill="url(#bmLime)"/>
    </g>
  </g>

  <!-- Typography Brand Lockup -->
  <g transform="translate(126, 42)">
    <!-- Primary Wordmark -->
    <text x="0" y="28" font-family="'Manrope', -apple-system, sans-serif" font-size="44" font-weight="900" letter-spacing="-1.8" fill="#173f32">Pet<tspan fill="url(#bmCoral)">Fuel</tspan></text>
    <!-- Subtitle Tagline -->
    <text x="2" y="49" font-family="'DM Sans', -apple-system, sans-serif" font-size="11" font-weight="800" letter-spacing="3" fill="#69756f">PET NUTRITION &amp; ESSENTIALS</text>
