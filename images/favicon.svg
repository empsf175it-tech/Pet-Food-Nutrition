  <ellipse cx="58" cy="25" rx="7" ry="11" transform="rotate(12 58 25)" fill="#ffffff"/>
  <ellipse cx="70" cy="36" rx="6.5" ry="10" transform="rotate(34 70 36)" fill="url(#favCoral)"/>

  <!-- Main Vessel Pad -->
  <g>
    <path d="M 48 76 C 34 76 25 66 25 55 C 25 47 32 43 40 48 C 44 50 46 52 48 53 C 50 52 52 50 56 48 C 64 43 71 47 71 55 C 71 66 62 76 48 76 Z" fill="#ffffff"/>
